<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ante-Social Invitational</title>
<meta name="theme-color" content="#0f2a1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0f2a1d; --felt-2:#143826; --card:#183f2c; --line:rgba(255,255,255,.09);
    --ink:#f4efe3; --muted:#a9b8ac; --gold:#e7c36a; --up:#5fd68a; --down:#ff7a6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #1b4a33 0%, var(--felt) 60%) fixed, var(--felt);
    color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
  header{text-align:center;margin-bottom:22px}
  .suits{letter-spacing:.5em;color:var(--gold);font-size:13px;opacity:.85}
  h1{font-family:"Playfair Display",serif;font-size:34px;line-height:1.05;margin:8px 0 6px}
  .sub{color:var(--muted);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:20px 0 18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:800}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tabs{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 13px Inter,sans-serif;padding:10px 2px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .h2h-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
  .h2h-pick select{width:100%;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:600 14px Inter,sans-serif}
  .h2h-pick span{color:var(--gold);font-weight:800;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
  .score .nm{font-weight:700;font-size:14px}.score .big{font-family:"Playfair Display",serif;font-size:40px;line-height:1}
  .score .dash{color:var(--muted);font-size:24px}
  .score .sub2{font-size:12px;color:var(--muted);margin-top:4px}
  .lead{color:var(--gold)}
  .facts{list-style:none;padding:0;margin:10px 0 0;font-size:13px;line-height:1.55}
  .facts li{padding:6px 0;border-top:1px solid var(--line)}
  .facts li:first-child{border-top:0}
  .rival{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
  .rival b{font-size:14px}.rival span{font-size:12px;color:var(--muted);white-space:nowrap}
  .chart{width:100%;height:auto;display:block}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .tgrid .stat b{font-size:18px}
  .insight{font-size:14px;line-height:1.5;padding:10px 0;border-top:1px solid var(--line)}
  .insight:first-child{border-top:0;padding-top:0}
  .insight .k{display:block;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:2px}
  .small{font-size:12px;color:var(--muted)}
  .tabs button.on{background:var(--gold);color:#1d1606}
  .panel{display:none}.panel.on{display:block}
  .row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .rank{font-weight:800;font-size:17px;color:var(--muted);text-align:center}
  .row:nth-child(1) .rank{color:var(--gold)}
  .name{font-weight:700;font-size:16px}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .net{font-weight:800;font-size:18px;text-align:right}
  .up{color:var(--up)}.down{color:var(--down)}
  .detail{grid-column:1/-1;display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
  .row.open .detail{display:block}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}
  .kv b{display:block;color:var(--ink);font-size:14px}
  .spark{width:100%;height:46px}
  h2{font-family:"Playfair Display",serif;font-size:22px;margin:24px 0 10px}
  .awards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .award{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .award .t{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .award .w{font-weight:700;font-size:15px;margin-top:4px}
  .award .s{font-size:12px;color:var(--muted)}
  .game{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
  .ghead{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer}
  .ghead b{font-size:15px}.ghead span{font-size:12px;color:var(--muted)}
  .gbody{display:none;padding:0 14px 12px}
  .game.open .gbody{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:7px 0;border-top:1px solid var(--line);text-align:right}
  th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td:first-child,th:first-child{text-align:left}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .next{position:relative;overflow:hidden;background:linear-gradient(160deg,#2a5a3f 0%,var(--card) 70%);
    border:1px solid rgba(231,195,106,.45);border-radius:20px;padding:22px 18px 20px;text-align:center;margin:4px 0 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .next .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .next .day{font-family:"Playfair Display",serif;font-size:32px;line-height:1.1;margin:8px 0 4px}
  .next .time{font-size:15px;color:var(--ink);opacity:.9}
  .next .count{display:inline-block;margin-top:12px;background:var(--gold);color:#1d1606;font-weight:800;font-size:13px;
    padding:6px 14px;border-radius:999px}
  .next .after{margin-top:12px;font-size:12px;color:var(--muted)}
  .rsvp{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;text-align:left}
  .rsvp .who{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .rsvp select,.rsvp input{flex:1;min-width:0;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:10px;font:500 15px Inter,sans-serif}
  .rsvp .btns{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
  .rsvp .btns button{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);border-radius:12px;
    padding:12px 4px;font:700 14px Inter,sans-serif;cursor:pointer}
  .rsvp .btns button.sel{background:var(--gold);color:#1d1606;border-color:var(--gold)}
  .rsvp .btns button:disabled{opacity:.5}
  .rsvp .plus{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted)}
  .rsvp .plus .ctl{display:flex;align-items:center;gap:10px}
  .rsvp .plus button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.2);
    color:var(--ink);font:700 18px Inter,sans-serif;cursor:pointer;line-height:1}
  .rsvp .plus b{color:var(--ink);font-size:16px;min-width:22px;text-align:center}
  .rsvp .msg{font-size:12px;color:var(--muted);margin-top:8px;min-height:15px;text-align:center}
  .rsvp .list{margin-top:10px;font-size:13px;line-height:1.5}
  .rsvp .list b{color:var(--gold);font-weight:700}
  .rsvp .list .none{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="suits">♠ ♥ ♦ ♣</div>
    <h1>The Ante-Social<br>Invitational</h1>
    <div class="sub" id="season"></div>
  </header>

  <div class="next" id="next"></div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="on" data-tab="standings">Standings</button>
    <button data-tab="h2h">Head-to-Head</button>
    <button data-tab="trends">Trends</button>
    <button data-tab="games">Game Log</button>
  </div>

  <section class="panel on" id="standings">
    <div id="board"></div>
    <h2>Season Awards</h2>
    <div class="awards" id="awards"></div>
  </section>

  <section class="panel" id="h2h">
    <div class="h2h-pick"><select id="h2h-a"></select><span>VS</span><select id="h2h-b"></select></div>
    <div id="h2h-out"></div>
    <h2>Rivalries</h2>
    <div id="rivals"></div>
  </section>

  <section class="panel" id="trends"><div id="trend-out"></div></section>

  <section class="panel" id="games"><div id="log"></div></section>

  <footer id="updated"></footer>
</div>

<script>
/* ===== DATA — add a new game at the top of the list after each night =====
   in  = total buy-ins (incl. rebuys), out = chips cashed out. */
const SEASON = "Since May 9, 2026";
const UPDATED = "Nov 4, 2026";
const BASE_GAMES = [
  { date:"2026-11-03", note:"Pizza covered by a 57.5% rake on cash-outs; results shown before rake.", players:[
    ["David S.",25,63.50],["Jon D.",50,55],["Ricky A.",25,34],["David F.",25,17],["Jake Dun.",25,7],["Kyler B.",25,0]]},
  { date:"2026-10-20", players:[
    ["Tommy B.",25,49.25],["Jake Dun.",25,29.50],["David F.",25,6.25],["Kyler B.",25,15]]},
  { date:"2026-10-06", note:"Kyler covered food ($69.25) personally; not taken from the pot.", players:[
    ["Jon D.",25,13.75],["Nick G.",50,48],["Taylor N.",25,43.75],["Tommy B.",50,13.50],["David F.",50,6.75],["Kyler B.",25,99.25]]},
  { date:"2026-08-21", players:[
    ["Chris C.",50,131.75],["David S.",75,131.50],["Nick G.",50,36.25],["James A.",50,0],["Jake Dav.",75,0],["Kyler B.",25,25.50]]},
  { date:"2026-05-09", players:[
    ["Jake Dav.",25,83.25],["Tyler V.",25,15],["Ricky A.",25,8.75],["Jon D.",25,0],["Kyler B.",25,18]]},
];
/* ===== SCHEDULE — synced from Kyler's "Tuesday Poker" calendar series =====
   Start times, Denver local. Cancelled nights are removed here. */
const SCHEDULE = [
  "2026-11-17T18:00","2026-12-01T18:00","2026-12-15T18:00","2026-12-29T18:00",
  "2027-01-12T18:00","2027-01-26T18:00",
];
const GAME_HOURS = 4.5; // 6–10:30pm
/* ===== end data ===== */

const $ = s => document.querySelector(s);
const money = n => (n<0?"−":n>0?"+":"")+"$"+Math.abs(n).toFixed(2).replace(/\.00$/,"");
const plain = n => "$"+n.toFixed(2).replace(/\.00$/,"");
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
let GAMES = BASE_GAMES;
function render(){
const chron = [...GAMES].sort((a,b)=>a.date.localeCompare(b.date));

const P = {};
chron.forEach(g=>{
  g.players.forEach(([name,inn,out])=>{
    const p = P[name] ||= {name,net:0,in:0,out:0,nights:0,wins:0,best:-Infinity,bestDate:"",rebuys:0,busts:0,run:[]};
    const n = out-inn;
    p.net+=n; p.in+=inn; p.out+=out; p.nights++;
    if(n>0)p.wins++; if(out===0)p.busts++;
    p.rebuys += Math.max(0,Math.round(inn/25)-1);
    if(n>p.best){p.best=n;p.bestDate=g.date}
    p.run.push(p.net);
  });
});
const players = Object.values(P).sort((a,b)=>b.net-a.net);


(function(){
  const now=Date.now();
  const toDate=d=>{const [a,b]=d.split("T"),[y,m,dd]=a.split("-").map(Number),[h,mi]=b.split(":").map(Number);
    return new Date(y,m-1,dd,h,mi)};
  const up=SCHEDULE.map(toDate).filter(d=>d.getTime()+GAME_HOURS*3600e3>now).sort((a,b)=>a-b);
  const el=$("#next");
  if(!up.length){el.innerHTML=`<div class="lbl">Next game</div><div class="day">TBD</div><div class="time">Watch the group chat</div>`;return}
  const n=up[0];
  const day=n.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  const time=n.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const days=Math.round((mid(n)-mid(new Date()))/864e5);
  const live=now>=n.getTime();
  const badge=live?"🔴 Game on now":days===0?"Tonight":days===1?"Tomorrow":`In ${days} days`;
  const after=up.slice(1,3).map(d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"})).join(" · ");
  el.innerHTML=`<div class="lbl">♠ Next game</div><div class="day">${day}</div>
    <div class="time">${time} · $25 buy-in</div><div class="count">${badge}</div>
    ${after?`<div class="after">Then ${after}</div>`:""}
    <div class="rsvp" id="rsvp"></div>`;
  rsvp(SCHEDULE.find(s=>toDate(s).getTime()===n.getTime()).slice(0,10));
})();

function rsvp(game){
  const box=$("#rsvp"), API="/api/rsvp";
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const counts={};GAMES.forEach(g=>g.players.forEach(([n])=>counts[n]=(counts[n]||0)+1));
  const roster=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let me=store.get("poker-name")||"", responses=[], guests=0;
  const showG=()=>$("#rv-g").textContent="+"+guests;
  const LABEL={in:"I'm in 👍",maybe:"Maybe 🤔",out:"Can't make it"};
  box.innerHTML=`<div class="who"><select id="rv-name"><option value="">Who are you?</option>
      ${roster.map(n=>`<option>${esc(n)}</option>`).join("")}<option value="__other">Someone else…</option></select>
      <input id="rv-other" placeholder="Your name" maxlength="30" style="display:none"></div>
    <div class="btns">${Object.entries(LABEL).map(([k,v])=>`<button data-s="${k}">${v}</button>`).join("")}</div>
    <div class="plus">Bringing a friend?<div class="ctl"><button data-g="-1" aria-label="fewer guests">−</button><b id="rv-g">+0</b><button data-g="1" aria-label="more guests">+</button></div></div>
    <div class="msg" id="rv-msg"></div><div class="list" id="rv-list"></div>`;
  const sel=$("#rv-name"), other=$("#rv-other"), msg=$("#rv-msg");
  if(me){ if(roster.includes(me)) sel.value=me; else {sel.value="__other";other.style.display="";other.value=me} }
  sel.onchange=()=>{other.style.display=sel.value==="__other"?"":"none"; paint.touched=false; guests=0; showG(); if(sel.value!=="__other"){me=sel.value;paint()} else other.focus()};
  other.oninput=()=>{me=other.value.trim();paint()};
  const name=()=>sel.value==="__other"?other.value.trim():sel.value;
  function paint(){
    const mine=responses.find(r=>r.name.toLowerCase()===(name()||"").toLowerCase());
    box.querySelectorAll(".btns button").forEach(b=>b.classList.toggle("sel",!!mine&&mine.status===b.dataset.s));
    if(mine&&!paint.touched){guests=mine.guests||0;showG()}
    const grp=s=>responses.filter(r=>r.status===s).sort((a,b)=>a.at.localeCompare(b.at)).map(r=>esc(r.name)+(r.guests?` +${r.guests}`:""));
    const ins=grp("in"),mb=grp("maybe"),out=grp("out");
    const headcount=responses.filter(r=>r.status==="in").reduce((t,r)=>t+1+(r.guests||0),0);
    $("#rv-list").innerHTML=!responses.length?`<span class="none">No RSVPs yet. Be the first.</span>`:
      `<div><b>In (${headcount}):</b> ${ins.join(", ")||"—"}</div>`+
      (mb.length?`<div><b>Maybe:</b> ${mb.join(", ")}</div>`:"")+
      (out.length?`<div><b>Out:</b> ${out.join(", ")}</div>`:"");
  }
  async function load(){
    try{const r=await fetch(API+"?game="+game,{cache:"no-store"});if(!r.ok)throw 0;responses=(await r.json()).responses||[];paint()}
    catch(e){$("#rv-list").innerHTML=`<span class="none">RSVPs aren't loading right now.</span>`}
  }
  box.querySelectorAll(".plus button").forEach(b=>b.onclick=async()=>{
    guests=Math.max(0,Math.min(5,guests+Number(b.dataset.g)));showG();paint.touched=true;
    const n=name(),mine=responses.find(r=>r.name.toLowerCase()===(n||"").toLowerCase());
    if(mine&&mine.status!=="out")save(n,mine.status);
  });
  async function save(n,status){
    box.querySelectorAll("button").forEach(x=>x.disabled=true); msg.textContent="Saving…";
    try{
      const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({game,name:n,status,guests:status==="out"?0:guests})});
      if(!r.ok)throw 0; responses=(await r.json()).responses||[]; store.set("poker-name",n); me=n;
      const g=status!=="out"&&guests?` (+${guests})`:"";
      msg.textContent=status==="in"?`You're in${g}. See you there.`:status==="maybe"?`Got it, maybe${g}.`:"Got it, you're out this time."; paint();
    }catch(e){msg.textContent="Couldn't save. Try again, or just text Kyler."}
    box.querySelectorAll("button").forEach(x=>x.disabled=false);
  }
  box.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{
    const n=name(); if(!n){msg.textContent="Pick your name first.";sel.focus();return}
    save(n,b.dataset.s);
  });
  load();
}
$("#season").textContent = SEASON+" · "+GAMES.length+" games";
$("#updated").textContent = "Last game "+fmtDate(GAMES[0].date)+" · updated "+UPDATED;
const pot = GAMES.reduce((s,g)=>s+g.players.reduce((t,p)=>t+p[1],0),0);
const bigPot = Math.max(...GAMES.map(g=>g.players.reduce((t,p)=>t+p[1],0)));
$("#stats").innerHTML = [["Total pot",plain(pot)],["Biggest pot",plain(bigPot)]]
  .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

function spark(run){
  const w=300,h=46,pts=[0,...run],mn=Math.min(...pts),mx=Math.max(...pts),r=(mx-mn)||1;
  const xy=pts.map((v,i)=>[i*(w/(pts.length-1||1)), h-4-((v-mn)/r)*(h-8)]);
  const zero=h-4-((0-mn)/r)*(h-8);
  const c=run[run.length-1]>=0?"var(--up)":"var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" x2="${w}" y1="${zero}" y2="${zero}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 4"/>
    <polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(p=>p.join(",")).join(" ")}"/></svg>`;
}

$("#board").innerHTML = players.map((p,i)=>`
  <div class="row">
    <div class="rank">${i===0?"👑":i+1}</div>
    <div><div class="name">${p.name}</div>
      <div class="meta">${p.nights} night${p.nights>1?"s":""} · ${p.wins} winning</div></div>
    <div class="net ${p.net>=0?"up":"down"}">${money(p.net)}</div>
    <div class="detail">
      <div class="kv">
        <div>Bought in<b>${plain(p.in)}</b></div>
        <div>Cashed out<b>${plain(p.out)}</b></div>
        <div>ROI<b>${Math.round(p.net/p.in*100)}%</b></div>
        <div>Best night<b>${money(p.best)}</b></div>
        <div>Rebuys<b>${p.rebuys}</b></div>
        <div>Busts<b>${p.busts}</b></div>
      </div>
      ${spark(p.run)}
    </div>
  </div>`).join("");
document.querySelectorAll(".row").forEach(r=>r.onclick=()=>r.classList.toggle("open"));

const by=(f,dir=-1)=>[...players].sort((a,b)=>dir*(f(a)-f(b)))[0];
const bestNight = players.map(p=>({p,v:p.best})).sort((a,b)=>b.v-a.v)[0];
const award=[
  ["💥 Biggest night",bestNight.p,p=>money(p.best)+" on "+fmtDate(p.bestDate)],
  ["🔁 Rebuy King",by(p=>p.rebuys),p=>p.rebuys+" rebuys"],
  ["🔥 Hot Hand",{name:players.filter(p=>p.wins===Math.max(...players.map(q=>q.wins))).map(p=>p.name).join(" & "),wins:Math.max(...players.map(q=>q.wins))},p=>p.wins+" winning nights"],
  ["📈 Best ROI (3+ nights)",[...players].filter(p=>p.nights>=3).sort((a,b)=>b.net/b.in-a.net/a.in)[0],p=>Math.round(p.net/p.in*100)+"% ROI"],
];
$("#awards").innerHTML = award.map(([t,p,s])=>`<div class="award"><div class="t">${t}</div><div class="w">${p.name}</div><div class="s">${s(p)}</div></div>`).join("");

$("#log").innerHTML = GAMES.map(g=>{
  const rows=[...g.players].sort((a,b)=>(b[2]-b[1])-(a[2]-a[1]));
  const potG=g.players.reduce((t,p)=>t+p[1],0);
  return `<div class="game"><div class="ghead"><div><b>${fmtDate(g.date)}</b><br><span>${g.players.length} players · ${plain(potG)} pot</span></div>
    <span>🏆 ${rows[0][0]} ${money(rows[0][2]-rows[0][1])}</span></div>
    <div class="gbody"><table><tr><th>Player</th><th>In</th><th>Out</th><th>Net</th></tr>
    ${rows.map(([n,i,o])=>`<tr><td>${n}</td><td>${plain(i)}</td><td>${plain(o)}</td><td class="${o-i>=0?"up":"down"}">${money(o-i)}</td></tr>`).join("")}
    </table>${g.note?`<div class="note">${g.note}</div>`:""}</div></div>`;
}).join("");
document.querySelectorAll(".ghead").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button,.panel").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); $("#"+b.dataset.tab).classList.add("on");
});
  renderH2H(); renderTrends();
}

/* ===== Head-to-Head ===== */
function seatOf(g,n){const p=g.players.find(x=>x[0]===n);return p?{in:p[1],out:p[2],net:p[2]-p[1]}:null}
function pairStats(a,b){
  const chron=[...GAMES].sort((x,y)=>x.date.localeCompare(y.date));
  const r={nights:[],wa:0,wb:0,ties:0,na:0,nb:0,koab:0,koba:0};
  chron.forEach(g=>{
    (g.knockouts||[]).forEach(([v,by])=>{if(by===a&&v===b)r.koab++;if(by===b&&v===a)r.koba++});
    const A=seatOf(g,a),B=seatOf(g,b); if(!A||!B)return;
    r.nights.push({date:g.date,a:A.net,b:B.net}); r.na+=A.net; r.nb+=B.net;
    if(A.net>B.net)r.wa++; else if(B.net>A.net)r.wb++; else r.ties++;
  });
  return r;
}
function withWithout(a,b){
  let w=[],wo=[];GAMES.forEach(g=>{const A=seatOf(g,a);if(!A)return;(seatOf(g,b)?w:wo).push(A.net)});
  const avg=x=>x.reduce((t,v)=>t+v,0)/x.length;
  return w.length&&wo.length?{w:avg(w),wo:avg(wo),nw:w.length,nwo:wo.length}:null;
}
function renderH2H(){
  const names=[...new Set(GAMES.flatMap(g=>g.players.map(p=>p[0])))];
  const pairs=[];
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++){
    const r=pairStats(names[i],names[j]); if(r.nights.length>=2)pairs.push({a:names[i],b:names[j],r});
  }
  pairs.sort((x,y)=>y.r.nights.length-x.r.nights.length||Math.abs(x.r.na-x.r.nb)-Math.abs(y.r.na-y.r.nb));
  const A=$("#h2h-a"),B=$("#h2h-b");
  const opts=names.slice().sort().map(n=>`<option>${n}</option>`).join("");
  A.innerHTML=opts;B.innerHTML=opts;
  const def=pairs[0]||{a:names[0],b:names[1]};
  A.value=def.a;B.value=def.b;
  const show=()=>{
    const a=A.value,b=B.value,out=$("#h2h-out");
    if(a===b){out.innerHTML=`<div class="card small">Pick two different players.</div>`;return}
    const r=pairStats(a,b),n=r.nights.length;
    if(!n){out.innerHTML=`<div class="card small">${a} and ${b} haven't played the same night yet.</div>`;return}
    const ahead=r.na>r.nb?a:r.nb>r.na?b:null;
    const facts=[];
    facts.push(`Nights at the same table: <b>${n}</b>${r.ties?` (${r.ties} tie${r.ties>1?"s":""})`:""}`);
    facts.push(`In those nights: ${a} <b class="${r.na>=0?"up":"down"}">${money(r.na)}</b> · ${b} <b class="${r.nb>=0?"up":"down"}">${money(r.nb)}</b>`);
    if(ahead)facts.push(`<b>${ahead}</b> is up <b>${plain(Math.abs(r.na-r.nb))}</b> on the other across shared nights`);
    const big=r.nights.map(x=>({...x,gap:x.a-x.b})).sort((x,y)=>Math.abs(y.gap)-Math.abs(x.gap))[0];
    if(big&&big.gap)facts.push(`Biggest gap: ${fmtDate(big.date)}, ${big.gap>0?a:b} beat ${big.gap>0?b:a} by ${plain(Math.abs(big.gap))}`);
    if(r.koab||r.koba)facts.push(`Knockouts: ${a} busted ${b} <b>${r.koab}</b>× · ${b} busted ${a} <b>${r.koba}</b>×`);
    [[a,b],[b,a]].forEach(([x,y])=>{const ww=withWithout(x,y);if(ww)facts.push(`With ${y} at the table, ${x} averages <b class="${ww.w>=0?"up":"down"}">${money(ww.w)}</b>/night; without, <b class="${ww.wo>=0?"up":"down"}">${money(ww.wo)}</b>`)});
    out.innerHTML=`<div class="card"><div class="score">
        <div><div class="big ${r.wa>r.wb?"lead":""}">${r.wa}</div><div class="nm">${a}</div></div>
        <div class="dash">–</div>
        <div><div class="big ${r.wb>r.wa?"lead":""}">${r.wb}</div><div class="nm">${b}</div></div></div>
        <div class="score"><div class="sub2" style="grid-column:1/-1">Nights won head-to-head (better result that night)</div></div>
        <ul class="facts">${facts.map(f=>`<li>${f}</li>`).join("")}</ul>
        <table style="margin-top:8px"><tr><th>Night</th><th>${a}</th><th>${b}</th></tr>
        ${r.nights.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td class="${x.a>=0?"up":"down"}">${money(x.a)}</td><td class="${x.b>=0?"up":"down"}">${money(x.b)}</td></tr>`).join("")}</table></div>`;
  };
  A.onchange=B.onchange=show; show();
  $("#rivals").innerHTML=pairs.length?pairs.slice(0,6).map(p=>{
    const lead=p.r.wa===p.r.wb?"all square":(p.r.wa>p.r.wb?p.a:p.b)+" leads";
    return `<div class="card rival" data-a="${p.a}" data-b="${p.b}"><b>${p.a} vs ${p.b}</b><span>${p.r.wa}–${p.r.wb} · ${lead} · ${p.r.nights.length} nights</span></div>`}).join("")
    :`<div class="card small">Rivalries show up once two players have shared 2+ nights.</div>`;
  document.querySelectorAll(".rival").forEach(el=>el.onclick=()=>{A.value=el.dataset.a;B.value=el.dataset.b;show();window.scrollTo({top:$("#h2h").offsetTop-10,behavior:"smooth"})});
}

/* ===== Trends ===== */
function renderTrends(){
  const chron=[...GAMES].sort((a,b)=>a.date.localeCompare(b.date));
  const N=chron.length, sum=x=>x.reduce((t,v)=>t+v,0), avg=x=>sum(x)/x.length;
  const pot=g=>sum(g.players.map(p=>p[1]));
  const pots=chron.map(pot), counts=chron.map(g=>g.players.length);
  const winTake=chron.map(g=>{const w=g.players.reduce((m,p)=>p[2]-p[1]>m[2]-m[1]?p:m);return {g,name:w[0],net:w[2]-w[1],share:w[2]/pot(g)}});
  const seats=chron.flatMap(g=>g.players), busts=seats.filter(p=>p[2]===0).length;
  const rebuys=chron.map(g=>sum(g.players.map(p=>Math.max(0,Math.round(p[1]/25)-1))));
  // chart
  const W=340,H=170,pad=26,bw=(W-pad*2)/N,mx=Math.max(...pots);
  const bars=chron.map((g,i)=>{const h=(pots[i]/mx)*(H-pad*2-14),x=pad+i*bw+bw*.18,y=H-pad-h;
    return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="4" fill="var(--gold)" opacity="${.55+.45*(i+1)/N}"/>
    <text x="${x+bw*.32}" y="${y-5}" text-anchor="middle" font-size="10" fill="var(--ink)" font-weight="700">${plain(pots[i])}</text>
    <text x="${x+bw*.32}" y="${H-pad+13}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${fmtDate(g.date)}</text>
    <text x="${x+bw*.32}" y="${H-pad-6}" text-anchor="middle" font-size="9.5" fill="#1d1606" font-weight="700">${counts[i]}👤</text>`}).join("");
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pot size by night">${bars}
    <line x1="${pad}" x2="${W-pad}" y1="${H-pad}" y2="${H-pad}" stroke="rgba(255,255,255,.18)"/></svg>`;
  const ins=[];
  if(N>=4){const h=Math.floor(N/2),e=avg(pots.slice(0,h)),l=avg(pots.slice(-h)),ch=Math.round((l-e)/e*100);
    ins.push(["Pot trend",ch>=0?`Pots are up <b>${ch}%</b> lately: ${plain(l)} average over the last ${h} games vs ${plain(e)} early on.`:`Pots are down <b>${-ch}%</b> lately: ${plain(l)} average over the last ${h} games vs ${plain(e)} early on.`])}
  const wt=avg(winTake.map(w=>w.share));
  ins.push(["Winner takes",`The night's big winner walks out with <b>${Math.round(wt*100)}%</b> of the pot on average.`]);
  const top=winTake.slice().sort((a,b)=>b.share-a.share)[0];
  ins.push(["Biggest heist",`${top.name} took <b>${Math.round(top.share*100)}%</b> of the ${plain(pot(top.g))} pot on ${fmtDate(top.g.date)}.`]);
  ins.push(["Bust rate",`<b>${Math.round(busts/seats.length*100)}%</b> of seats end the night at $0. Rebuys: <b>${avg(rebuys).toFixed(1)}</b> per night.`]);
  const prof=avg(chron.map(g=>g.players.filter(p=>p[2]>p[1]).length/g.players.length));
  ins.push(["Who goes home happy",`Only <b>${Math.round(prof*100)}%</b> of players leave up money on a typical night.`]);
  // big-table specialist
  const med=counts.slice().sort((a,b)=>a-b)[Math.floor(N/2)];
  const spec=[...new Set(seats.map(p=>p[0]))].map(n=>{const big=[],small=[];chron.forEach(g=>{const s=seatOf(g,n);if(s)(g.players.length>=med?big:small).push(s.net)});
    return big.length&&small.length?{n,d:avg(big)-avg(small),big:avg(big),small:avg(small)}:null}).filter(Boolean).sort((a,b)=>b.d-a.d);
  if(spec.length){const s=spec[0];ins.push(["Big-table specialist",`${s.n} averages <b class="up">${money(s.big)}</b> at tables of ${med}+ and <b class="${s.small>=0?"up":"down"}">${money(s.small)}</b> at smaller ones.`])}
  const kos=chron.flatMap(g=>g.knockouts||[]);
  if(kos.length){const c={};kos.forEach(([v,by])=>c[by]=(c[by]||0)+1);const [k,v]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    ins.push(["Assassin",`${k} has knocked out <b>${v}</b> player${v>1?"s":""} this season.`])}
  $("#trend-out").innerHTML=`
    <div class="tgrid">
      <div class="stat"><b>${plain(avg(pots))}</b><span>Avg pot</span></div>
      <div class="stat"><b>${avg(counts).toFixed(1)}</b><span>Avg players</span></div>
      <div class="stat"><b>${plain(avg(winTake.map(w=>w.net)))}</b><span>Avg winner's take</span></div>
      <div class="stat"><b>${Math.max(...counts)}</b><span>Biggest table</span></div>
    </div>
    <div class="card"><div class="small" style="margin-bottom:6px">Pot by night (👤 = players)</div>${chart}</div>
    <div class="card">${ins.map(([k,v])=>`<div class="insight"><span class="k">${k}</span>${v}</div>`).join("")}</div>
    <div class="small" style="text-align:center">Based on ${N} games. Gets sharper every night.</div>`;
}

(async function boot(){
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),2500);
    const r=await fetch("/api/games",{signal:ctl.signal,cache:"no-store"});
    if(r.ok){
      const extra=(await r.json()).games||[], by={};
      BASE_GAMES.forEach(g=>by[g.date]=g);
      extra.forEach(g=>{if(g&&/^\d{4}-\d{2}-\d{2}$/.test(g.date)&&Array.isArray(g.players)&&g.players.length)by[g.date]=g});
      GAMES=Object.values(by).sort((a,b)=>b.date.localeCompare(a.date));
    }
  }catch(e){}
  render();
})();
</script>
