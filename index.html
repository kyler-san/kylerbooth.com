<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyler Booth</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 16px; box-sizing: border-box;
    font-family: "Courier New", Courier, monospace; color: #33ff66;
  }
  .gif { position: relative; width: min(480px, 100%); aspect-ratio: 480 / 360; }
  .gif iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  p { margin: 0; font-size: clamp(14px, 3.5vw, 20px); letter-spacing: 0.05em; text-align: center; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="gif">
    <iframe src="https://giphy.com/embed/5ftsmLIqktHQA" title="Ah ah ah" allowfullscreen></iframe>
  </div>
  <p>YOU DIDN'T SAY THE MAGIC WORD<span class="cursor">_</span></p>
</body>
</html>
